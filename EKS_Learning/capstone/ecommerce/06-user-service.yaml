# user-service — 2 replicas, same lifecycle pattern as product (Day-02, Day-04)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: ecommerce
  labels:
    app: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
      - name: user
        image: your-org/user-service:1.0.0   # replace with your ECR/GHCR image
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: ecommerce
spec:
  selector:
    app: user
  ports:
  - name: http
    port: 8080
    targetPort: http