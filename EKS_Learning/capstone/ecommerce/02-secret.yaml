# db-secret Opaque Secret — injected via envFrom into backend services (Day-04, Day-15)
# Production tip: source this from AWS Secrets Manager with the EKS
# Secrets Store CSI driver instead (see Day-29_Secrets_Manager_Integration).
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ecommerce
type: Opaque
stringData:
  DB_USER: "ecommerce"
  DB_PASSWORD: "CHANGE-ME-use-a-strong-password"
  DB_NAME: "ecommerce"