# prometheus-alerts.yaml
# Purpose: Prometheus alert rules for PodCrashLooping, HighCPU and HighMemory.
# Maps to: Day-14 (EKS Monitoring & Logging), Day-41 (Prometheus Operator), Day-45 (Monitoring Stack Practice)
# Apply: kubectl apply -f prometheus-alerts.yaml (mount as rules/alerts.yml and include via prometheus.yml rule_files)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: pod-health
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
              description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in the last 15 minutes."
      - name: resource-usage
        rules:
          - alert: HighCPU
            expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{image!=""}[5m])) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on pod {{ $labels.pod }}"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 80% of a CPU core for 10 minutes."
          - alert: HighMemory
            expr: sum by (namespace, pod) (container_memory_working_set_bytes{image!=""}) > 2e9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on pod {{ $labels.pod }}"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} working set memory is above 2GB for 10 minutes."