# alertmanager-config.yaml
# Purpose: Alertmanager routing with a Slack webhook receiver. Replace the slack_api_url placeholder with a real incoming webhook.
# Maps to: Day-14 (EKS Monitoring & Logging), Day-41 (Prometheus Operator), Day-45 (Monitoring Stack Practice)
# Apply: kubectl apply -f alertmanager-config.yaml (mounted into the Alertmanager pod)
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      slack_api_url: https://hooks.slack.com/services/XXXX/YYYY/ZZZZ
    route:
      receiver: slack-alerts
      group_by: [alertname, cluster]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: slack-alerts
        slack_configs:
          - channel: "#alerts"
            send_resolved: true
            title: "{{ .GroupLabels.cluster }} | {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"