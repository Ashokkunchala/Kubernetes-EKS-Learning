# prometheus-scrape-config.yaml
# Purpose: Prometheus scrape config for automatically discovering annotated pods (prometheus.io/scrape) plus the node exporter.
# Maps to: Day-14 (EKS Monitoring & Logging), Day-41 (Prometheus Operator), Day-44 (Custom Metrics)
# Apply: kubectl apply -f prometheus-scrape-config.yaml (mount as config/prometheus.yml in your Prometheus pod)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: my-eks-cluster
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.monitoring.svc:9100"]
            labels:
              job: node-exporter