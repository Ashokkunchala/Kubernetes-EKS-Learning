# serviceaccount.yaml
# Purpose: ServiceAccount for the secure-app namespace wired to an IAM role via IRSA annotation; token not auto-mounted.
# Maps to: Day-11 (EKS IAM Roles & Policies), Day-26 (OIDC Provider Setup), Day-27 (IRSA), Day-28 (Pod Level IAM)
# Apply: kubectl apply -f serviceaccount.yaml (after creating the IAM role & trust policy)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: secure-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/secure-app-role
automountServiceAccountToken: false