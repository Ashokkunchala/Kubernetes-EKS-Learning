# namespace.yaml
# Purpose: Creates the secure-app namespace enforced at the Kubernetes "restricted" Pod Security Standard via built-in Pod Security Admission labels.
# Maps to: Day-04 (Namespaces), Day-15 (EKS Security Best Practices), Day-28 (Pod Level IAM Permissions)
# Apply: kubectl apply -f namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: secure-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: security-lab