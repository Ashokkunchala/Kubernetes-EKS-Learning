# ============================================================
# 02-secret.yaml
# Opaque secret with base64-encoded values, injected via envFrom.
# NOTE: echo -n "value" | base64  <-- generates these values.
# Maps to: Day-04 (Namespaces, ConfigMaps, Secrets)
#          Day-06 (ConfigMaps and Secrets Practice)
# Apply:   kubectl apply -f 02-secret.yaml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: demo
type: Opaque
stringData:
  API_KEY: "demo-api-key-1234"
  DB_PASSWORD: "sup3rSecret!"