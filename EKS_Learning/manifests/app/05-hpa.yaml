# ============================================================
# 05-hpa.yaml
# HorizontalPodAutoscaler (autoscaling/v2) scaling on CPU + memory.
# Requires Metrics Server to be installed in the cluster.
# Maps to: Day-53 (Cluster Autoscaler vs Karpenter) - related
# Apply:   kubectl apply -f 05-hpa.yaml
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60