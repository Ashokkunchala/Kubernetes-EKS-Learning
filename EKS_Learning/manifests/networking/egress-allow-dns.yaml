# ============================================================
# egress-allow-dns.yaml
# Allows egress DNS (udp/53) + HTTPS (tcp/443) to the kube-dns
# service in the kube-system namespace, via namespaceSelector.
# Maps to: Day-17 (Network Policies with Calico)
# Apply:   kubectl apply -f egress-allow-dns.yaml
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: demo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443